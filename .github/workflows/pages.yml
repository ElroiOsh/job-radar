name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # ~08:00, 12:00, 16:00, 20:00 Israel (UTC+3)
    - cron: "0 5,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Scan job boards (scheduled / manual)
        if: github.event_name != 'push'
        run: npx tsx src/run-daily.ts
        continue-on-error: true
      - name: Rebuild dashboard from last listings
        run: npx tsx src/run-daily.ts --skip-fetch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
