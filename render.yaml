# Full app (dashboard + feedback API) on Render — permanent URL.
# After connecting GitHub: create a Web Service from this repo.
services:
  - type: web
    name: job-radar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run serve
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEB_DASHBOARD_URL
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
